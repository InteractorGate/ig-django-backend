version: "3.9"

services:

  # ── Django backend ───────────────────────────────────────────────────────────
  # Databases are cloud-hosted (Azure SQL + Azure Cosmos DB), so no local
  # DB containers are needed — connection strings come from .env.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ig_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
