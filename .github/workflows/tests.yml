name: Tests

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  workflow_call:      # lets deploy.yml gate the deployment on this suite

jobs:
  test:
    runs-on: ubuntu-latest
    # Dummy values so config/settings/base.py imports in CI (no .env here).
    # The test settings override the DB to SQLite and mock Cosmos, so these
    # are never used to connect anywhere — they only satisfy env() at import.
    env:
      DJANGO_SECRET_KEY: test-secret-key-not-for-production
      SQL_DB: test
      SQL_USER: test
      SQL_PASSWORD: test
      SQL_HOST: localhost
      MONGO_URI: mongodb://localhost:27017/test
      MONGO_DB: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install unixODBC (pyodbc dependency)
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - name: Install PyTorch (CPU build)
        # CPU wheel keeps CI fast/light; "+cpu" satisfies the torch==2.12.1 pin.
        run: pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        # Test settings use in-memory SQLite and mock Cosmos — no external services.
        run: python manage.py test --settings=config.settings.test --verbosity=2
