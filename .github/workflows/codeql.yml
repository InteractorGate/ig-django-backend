# .github/workflows/codeql.yml

name: "CodeQL Security Scan"

on:
  push:
    branches: [ "main", "develop" ]        # ← también escanea develop
  pull_request:
    branches: [ "main", "develop" ]        # ← atrapa vulnerabilidades antes del merge
  schedule:
    - cron: '0 2 * * 1'                   # ← lunes a las 2am UTC (más legible)

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'           # ← ajusta a tu versión

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          queries: security-extended        # ← detecta más vulnerabilidades Django:
                                            #   SQL injection, XSS, CSRF, path traversal,
                                            #   deserialización insegura, etc.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
          upload: true                      # ← sube resultados a la pestaña Security
